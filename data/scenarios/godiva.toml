# Godiva — bare HEU sphere criticality benchmark (G0a).
#
# Model: JEFF Report 16 Annex 3 (OECD/NEA, open), adopting CSEWG Benchmark Book
# BNL 19302 ENDF 202 Rev. 11-81, fast benchmark F5. Full derivation and
# citations in data/benchmarks/godiva.md. status = PUBLIC-DERIVED.
#
# Benchmark k_eff = 1.0000 +/- 0.0010.

schema_version = 1
name = "godiva"
seed = 20260802
mode = "eigen_only"

layers = [
  { id = "core", r_outer_cm = 8.741, material = "u_godiva", status = "PUBLIC-DERIVED" },
]

[data]
xs_set        = "fast4"
materials_dir = "data/materials"

[time]
t_zero = "he_initiation"

# Required by the schema; a bare-sphere eigenvalue calculation has no initiator,
# no compression and no burn. These are inert placeholders, not physics.
[initiator]
strength_n_per_s = 0.0
t_fire_s         = 0.0
pulse_width_s    = 1.0e-8

[compression]
tier  = 2
ratio = 1.0

[kinetics]
generation_time_s_initial = 1.0e-8
eigen_refresh_gens        = 10
eigen_refresh_dr_frac     = 0.005
t_max_s                   = 1.0e-6
quench_epsilon            = 1.0e-4

# C-900 gate configuration. C-900b (interactive) is NEVER valid for a gate claim.
[eigen]
batch    = 1000000
inactive = 50
active   = 200

[transport]
sim_neutrons = 1000000

[hydro]
every_gens = 10

[output]
tallies = ["k"]
checkpoint_every_gens = 100
dump_fields = false
dump_stride = 10
dump_max_frames = 0
dump_budget_gb = 20
